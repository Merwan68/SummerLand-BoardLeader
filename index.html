    <script>
      // Single Page App restore for static hosts
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        } else if (l.search.indexOf('p=/') !== -1) {
          var p = l.search.match(/p=\/([^&]*)/);
          if (p && p[1]) {
            var decoded = '/' + decodeURIComponent(p[1]);
            window.history.replaceState(null, null, decoded + l.hash);
          }
        }
      }(window.location));
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-blue-600 selection:text-white">

  </body>
